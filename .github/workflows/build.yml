name: 'build'

on:
  workflow_dispatch:
  push:
    tags:
      - v**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  download-dbip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Download dbip database
        run: ./ci/fetch_latest_dbip.sh
      - uses: actions/upload-artifact@v6
        with:
          name: dbip
          path: "dbip.mmdb"

  build-binaries:
    needs: download-dbip
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - os: macos-latest
            rust_target: x86_64-apple-darwin
          - os: macos-latest
            rust_target: aarch64-apple-darwin
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - os: windows-latest
            rust_target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Disable crlf
        if: matrix.platform.os == 'windows-latest'
        run: |
          git config --global core.autocrlf input

      - uses: actions/checkout@v5

      # Download the previously uploaded artifacts
      - uses: actions/download-artifact@v7
        id: download
        with:
          name: dbip
          path: src-tauri/

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: 'Setup Rust'
        if: matrix.platform.rust_target == 'aarch64-apple-darwin' || matrix.platform.rust_target == 'x86_64-apple-darwin' || matrix.platform.rust_target == 'aarch64-pc-windows-msvc'
        run: rustup target add ${{matrix.platform.rust_target}}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.platform.rust_target }}
          workspaces: |
            src-tauri

      - name: install dependencies (ubuntu only)
        if: matrix.platform.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libfontconfig-dev

      - name: install npm packages
        run: npm ci

      - uses: tauri-apps/tauri-action@v0.6.2
        id: tauri_build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # minisign key for the in-app updater (bundle.createUpdaterArtifacts)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.platform.rust_target }}

      # Updater signatures, turned into latest.json by the publish job
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform.rust_target }}-sig
          path: src-tauri/target/${{ matrix.platform.rust_target }}/release/bundle/**/*.sig

      - name: Git status and version
        run: |
          git status
          git describe --tags --dirty --always
          git diff

      # macOS: the updater archive (the .app itself is a directory, the .sig is uploaded above)
      - uses: actions/upload-artifact@v6
        if: matrix.platform.os == 'macos-latest'
        with:
          name: ${{ matrix.platform.rust_target }}
          path: src-tauri/target/${{ matrix.platform.rust_target }}/release/bundle/macos/*.app.tar.gz

      - uses: actions/upload-artifact@v6
        if: matrix.platform.os != 'macos-latest'
        with:
          name: ${{ matrix.platform.rust_target }}
          path: "${{ join(fromJSON(steps.tauri_build.outputs.artifactPaths), '\n') }}"

      - name: pack webapp
        if: matrix.platform.os == 'ubuntu-24.04'
        working-directory: dist
        id: pack-webapp
        run: |
          GIT_VERSION=`git describe --tags --always`
          zip -9 -r "torrent-remote-web-$GIT_VERSION.zip" ./* -x create\* -x \*.map -x \*flag-icons\*
          echo "ZIPFILE=torrent-remote-web-$GIT_VERSION.zip" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v6
        if: matrix.platform.os == 'ubuntu-24.04'
        with:
          name: build web
          path: "dist/${{ steps.pack-webapp.outputs.ZIPFILE }}"

  publish:
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # Download the previously uploaded artifacts
      - uses: actions/download-artifact@v7
        id: download
        with:
          path: artifacts
      # Both mac builds produce "Torrent Remote.app.tar.gz" (+ .sig); give them
      # distinct names. The files are searched because the artifacts keep
      # different folder layouts (the .sig upload is a glob, the archive is not).
      - name: Rename mac app archives
        run: |
          for arch in x86_64 aarch64; do
            find artifacts -path "*/${arch}-apple-darwin*" -name "Torrent Remote.app.tar.gz*" -print0               | while IFS= read -r -d "" f; do
                  mv -v "$f" "$(dirname "$f")/$(basename "$f" | sed "s/^Torrent Remote\.app/TorrentRemote_${arch}.app/")"
                done
          done
      - name: Downloaded artifacts
        run: ls -lhR artifacts/

      # Manifest read by tauri-plugin-updater (plugins.updater.endpoints)
      - name: Generate latest.json
        run: python3 ci/make_latest_json.py artifacts "${{ github.ref_name }}" "${{ github.repository }}" > artifacts/latest.json && cat artifacts/latest.json

      # And create a release with the artifacts attached
      # Draft release with GitHub's own generated notes (commits since the
      # previous tag); pre-release tags such as v2.0.0-rc.1 are marked as such.
      - name: 'create release'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: ./artifacts/**/*
